name: Infrastructure Security Policy Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  policy-validation:
    name: Infrastructure Policy Validation
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    
    - name: setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Validate infrastructure Resources
      run: python3 -m scripts.check_inventory
    
    - name: upload validation report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: infrastructure policy report
        path: reports/policy-report.json
        if-no-files-found: warn
